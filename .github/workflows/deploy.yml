name: CD - Deploy to GitHub Pages

# CD: cada merge de un PR a main (y cualquier push a main) corre las pruebas,
# construye y publica en GitHub Pages. Luego comenta en el PR la liga publicada.
# Manual: Actions → "CD - Deploy to GitHub Pages" → Run workflow → elige la rama.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; no cancela uno que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Se muestra en el menú para saber qué versión está publicada.
          VITE_BUILD_INFO: ${{ github.ref_name }} · ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Avisa en el PR que se mezcló que ya está publicado.
  notify:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            const merged = prs.filter((pr) => pr.merged_at && pr.base.ref === 'main');
            for (const pr of merged) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `🚀 Publicado en GitHub Pages: ${process.env.PAGE_URL}\n\nCommit \`${context.sha.slice(0, 7)}\``,
              });
            }
            core.info(merged.length ? `Comentado en #${merged.map((p) => p.number).join(', #')}` : 'Push directo, sin PR');
